[project]
name = "timothy-api"
version = "0.1.0"
description = "FastAPI backend: authorization, enforcement workers, sweep scheduler"
requires-python = ">=3.13"
dependencies = [
    "timothy-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "discord-py>=2.4",
]

[project.scripts]
timothy-api = "timothy_api.__main__:main"

[tool.uv.sources]
timothy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timothy_api"]
