[project]
name = "timothy-migration"
version = "0.1.0"
description = "One-shot Mongo → SQLite import, and the checks that make the cutover reviewable"
requires-python = ">=3.13"
# `pymongo` is here for `bson` alone — the importer reads a `mongodump` directory and
# never opens a connection. The standalone `bson` distribution on PyPI is a different,
# incompatible package; this is the one that decodes what `mongodump` writes.
dependencies = [
    "timothy-core",
    "pymongo>=4.10",
    "httpx>=0.28",
]

[project.scripts]
timothy-migrate = "timothy_migration.__main__:main"

[tool.uv.sources]
timothy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timothy_migration"]
