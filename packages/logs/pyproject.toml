[project]
name = "timothy-logs"
version = "0.1.0"
description = "One logging setup — rotating JSON files, redacted — for every Timothy process"
requires-python = ">=3.13"
# Deliberately empty. The bot depends on this and must not, through it, acquire the
# domain, SQLAlchemy or anything else `core` brings (PLAN.md, "Layout"). A logging setup
# that needed a dependency to work would not be one both processes could share.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/timothy_logs"]
