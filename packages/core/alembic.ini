# Alembic CLI config, for development only.
#
#   cd packages/core
#   uv run alembic revision --autogenerate -m "what changed"
#   uv run alembic upgrade head
#
# At runtime nothing reads this file: the backend calls
# `timothy_core.migrations.upgrade_to_head(url)`, which builds its own config against
# the migrations packaged in the wheel.

[alembic]
script_location = src/timothy_core/migrations
prepend_sys_path = src
path_separator = os
file_template = %%(rev)s_%%(slug)s
sqlalchemy.url = sqlite:///timothy.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
