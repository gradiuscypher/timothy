# nginx's own log rotation, inside the container that writes them.
#
# nginx does not rotate anything by itself: it opens the two files at startup and appends
# to them until the disk fills. Every other service in the stack bounds its own — the
# Python processes through `RotatingFileHandler`, cloudflared through
# `TUNNEL_LOGDIRECTORY` — and leaving this one to a `logrotate` entry on the host would
# make the bind mount something the host has to know about, rather than a directory it
# only reads. See ADR 0014.
#
# The numbers deliberately match `timothy_logs`: 10MB a file, nine kept behind the live
# one, so each of these tops out at 100MB exactly as `backend.log` does.

/logs/web-access.log /logs/web-error.log {
    size 10M
    rotate 9
    missingok
    notifempty
    nocompress
    # Uncompressed on purpose, like the Python files. These are read with `grep` and
    # `jq` by somebody who already knows what they are looking for, and needing `zgrep`
    # for the older half of the same question is a papercut that costs more than the
    # disk it saves.

    su root root
    # Not a privilege change — logrotate already runs as root here. It is the documented
    # way to say "I know what this directory looks like": /logs is world-writable, because
    # four containers running as four different users all have to write into it, and
    # logrotate refuses to touch a file under a directory like that unless `su` is given.
    # Without this line rotation silently does nothing, which is the failure mode this
    # whole arrangement exists to avoid.

    create 0644 root root
    # Recreate immediately rather than waiting for the reopen below. nginx would create
    # it anyway on SIGUSR1, but between the rename and the signal there is a window with
    # no file at all, and a request served in it is a request nothing recorded.

    sharedscripts
    postrotate
        # SIGUSR1 to the master, which closes the old descriptors and opens the new
        # files. Without it nginx holds the renamed inode and keeps writing to
        # `web-access.log.1` forever — the rotation appears to work and the live file
        # never grows again.
        /usr/sbin/nginx -s reopen
    endscript
}
