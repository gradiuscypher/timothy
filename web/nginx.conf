# Access logging without the query string. nginx's own `combined` format logs `$request`,
# which is the whole request line — and `/api/auth/callback?code=...` carries a live OAuth
# authorization code. Logging `$uri` instead keeps the route (which is what anyone
# debugging actually wants) and drops the arguments, so no credential can arrive here in
# the first place. `$http_referer` is gone for the same reason: it is a URL somebody else
# chose, and it is worth nothing on a single-origin SPA.
log_format timothy '$remote_addr - $time_iso8601 "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent ${request_time}s "$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The client's real address, recovered from behind the tunnel.
    #
    # cloudflared reaches nginx from inside the compose network, so `$remote_addr` is its
    # container address — the same 172.x on every line, which is worth nothing to anyone
    # reading the log. Cloudflare's edge records the true client address in
    # `CF-Connecting-IP` and cloudflared passes it through; `realip` rewrites
    # `$remote_addr` to it, so the access log, `X-Real-IP` and `X-Forwarded-For` all carry
    # the real address without any of them changing.
    #
    # Trusting a header is only safe because of what cannot reach this port. Nothing is
    # published and the tunnel is the only ingress, so the only peer that can present
    # `CF-Connecting-IP` is cloudflared, carrying what Cloudflare wrote. Publish port 80
    # and this becomes spoofable by anyone — the two facts are linked, and changing the
    # first means revisiting this.
    #
    # The trusted range is Docker's private pool rather than the network's current subnet,
    # which compose reassigns whenever the network is recreated. A subnet pinned here
    # would work until the day someone runs `compose down` and then silently log the
    # proxy's address again.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;

    # Each twice, on purpose. The file is the durable copy in the shared log directory,
    # which outlives the container; the stream keeps `docker compose logs web` working as
    # it did. Only what nginx attributes to this server reaches these — a failure to
    # start, or to parse this file, still goes to the image's own error log on stderr.
    access_log /logs/web-access.log timothy;
    access_log /dev/stdout timothy;
    error_log  /logs/web-error.log warn;
    error_log  /dev/stderr warn;

    # One origin for the SPA and the API: no CORS, and SameSite=Lax just works.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The session cookie and the CSRF check both read headers set above. Nothing here
        # may be cached: every /api response is about one signed-in person.
        proxy_set_header Origin            $http_origin;
        add_header Cache-Control "no-store" always;
    }

    # Vite fingerprints these, so the name changes whenever the bytes do.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # IBM Plex Mono ships in the image; Berkeley Mono is bind-mounted onto
    # /fonts/berkeley/ on the host that has the licence and is absent everywhere else.
    # `=404` rather than the SPA fallback below, which would answer a missing font with
    # index.html and a 200 — a response the browser spends a request on and then cannot
    # decode. A real 404 lets the font stack in styles.css fall through immediately.
    #
    # A week rather than the immutable year on /assets/: these names are fixed by hand
    # rather than fingerprinted by Vite, so the bytes behind one can change.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # SPA history fallback. Never cached: it is the document that names the current
    # bundle, and a stale one points at assets that have been deleted.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
