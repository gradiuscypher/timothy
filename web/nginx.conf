server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # One origin for the SPA and the API: no CORS, and SameSite=Lax just works.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The session cookie and the CSRF check both read headers set above. Nothing here
        # may be cached: every /api response is about one signed-in person.
        proxy_set_header Origin            $http_origin;
        add_header Cache-Control "no-store" always;
    }

    # Vite fingerprints these, so the name changes whenever the bytes do.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA history fallback. Never cached: it is the document that names the current
    # bundle, and a stale one points at assets that have been deleted.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
