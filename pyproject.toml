[project]
name = "timothy"
version = "0.1.0"
description = "Shared moderation service for Discord — workspace root"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "timothy-core",
    "timothy-api",
    "timothy-bot",
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
timothy-core = { workspace = true }
timothy-api = { workspace = true }
timothy-bot = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "anyio>=4.7",
    "httpx2>=0.1",
    "ruff>=0.9",
    "ty>=0.0.1a10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# ---------------------------------------------------------------------------
# ruff — format + lint, strict. Configured once at the root for every member.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 96
target-version = "py313"
src = ["packages/core/src", "apps/api/src", "apps/bot/src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing-comma-missing — conflicts with the formatter
    "CPY001",  # copyright notices — the licence lives in LICENSE
    "D203",    # one-blank-line-before-class — mutually exclusive with D211
    "D213",    # multi-line-summary-second-line — mutually exclusive with D212
    "ISC001",  # single-line-implicit-string-concat — conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/versions/**" = [
    "INP001",  # alembic loads revisions by path, not as a package
]
"apps/api/src/timothy_api/**" = [
    # `HTTPException(detail=...)` is the message the API's caller reads — the API's
    # contract, not an exception whose text belongs in its class.
    "EM101",
    "EM102",
    "TRY003",
]
"apps/api/src/timothy_api/routers/**" = [
    # A FastAPI handler declares its dependencies as parameters, so the argument count
    # measures how much is injected rather than how much the reader has to hold.
    "PLR0913",
]
"**/tests/**" = [
    # A pytest fixture is requested by name, so one that exists only for its side effect
    # — a migrated database, a registered guild, a pool that already exists — reads as an
    # unused argument. Renaming it to `_pool` would stop pytest finding it.
    "ARG001",
    "S101",    # assert — that is what tests are made of
    "S105",    # hardcoded-password-string — fixtures, not secrets
    "S106",    # hardcoded-password-func-arg
    "PLR2004", # magic-value-comparison
    "D",       # docstrings
    "INP001",  # implicit-namespace-package — test dirs are not packages
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
]

[tool.ruff.lint.isort]
known-first-party = ["timothy_core", "timothy_api", "timothy_bot"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# ty — type checking, strict. Every diagnostic that can be an error is one.
# ---------------------------------------------------------------------------

[tool.ty.environment]
python-version = "3.13"
root = [
    "packages/core/src",
    "apps/api/src",
    "apps/bot/src",
    "apps/api",  # so `tests` is a package and its `from .conftest import ...` resolves
    # The bot's tests share `support.py` by plain import instead: two packages both named
    # `tests` cannot both resolve, and only one of them can have the root.
    "apps/bot/tests",
]

[tool.ty.src]
include = ["packages", "apps"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
unresolved-import = "error"
unused-ignore-comment = "error"
redundant-cast = "error"
division-by-zero = "error"

[tool.ty.terminal]
error-on-warning = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages/core/tests", "apps/api/tests", "apps/bot/tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--import-mode=importlib",
]
pythonpath = ["apps/bot/tests"]  # so `support` imports the same way the type checker reads it
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["timothy_core", "timothy_api", "timothy_bot"]
concurrency = ["thread", "greenlet"]
# `TestClient` runs the app in its own thread, and SQLAlchemy's async layer switches
# greenlets on every `await`. Without both, request handlers report as unexecuted lines
# in code the tests demonstrably run.

[tool.coverage.report]
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
