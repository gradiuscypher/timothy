name: timothy

# Nothing publishes a port. Cloudflare Tunnel is the only ingress and it fronts nginx,
# which serves the SPA and proxies /api to the backend. See PLAN.md, "Shape".

services:
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      TIMOTHY_LOG_LEVEL: ${TIMOTHY_LOG_LEVEL:-info}
      TIMOTHY_DATABASE_URL: sqlite+aiosqlite:////data/timothy.db
      TIMOTHY_DISCORD_TOKEN: ${TIMOTHY_DISCORD_TOKEN:?set TIMOTHY_DISCORD_TOKEN in .env}
      TIMOTHY_INTERNAL_TOKEN: ${TIMOTHY_INTERNAL_TOKEN:?set TIMOTHY_INTERNAL_TOKEN in .env}
      TIMOTHY_MANAGEMENT_GUILD_ID: ${TIMOTHY_MANAGEMENT_GUILD_ID:?set TIMOTHY_MANAGEMENT_GUILD_ID in .env}
      TIMOTHY_DRY_RUN: ${TIMOTHY_DRY_RUN:-true}
      TIMOTHY_AUTO_SUBSCRIBE_POOL: ${TIMOTHY_AUTO_SUBSCRIBE_POOL:-global}
      TIMOTHY_PERMISSION_CACHE_TTL: ${TIMOTHY_PERMISSION_CACHE_TTL:-60}
      TIMOTHY_SWEEP_INTERVAL: ${TIMOTHY_SWEEP_INTERVAL:-3600}
      TIMOTHY_ENFORCEMENT_BURST_LIMIT: ${TIMOTHY_ENFORCEMENT_BURST_LIMIT:-25}
      TIMOTHY_WORKERS_ENABLED: ${TIMOTHY_WORKERS_ENABLED:-true}
      TIMOTHY_JOB_POLL_INTERVAL: ${TIMOTHY_JOB_POLL_INTERVAL:-1}
      TIMOTHY_JOB_MAX_ATTEMPTS: ${TIMOTHY_JOB_MAX_ATTEMPTS:-5}
    volumes:
      - data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [timothy]

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TIMOTHY_DISCORD_TOKEN: ${TIMOTHY_DISCORD_TOKEN:?set TIMOTHY_DISCORD_TOKEN in .env}
      TIMOTHY_INTERNAL_TOKEN: ${TIMOTHY_INTERNAL_TOKEN:?set TIMOTHY_INTERNAL_TOKEN in .env}
      # The same guild the backend reads. Registering the pool commands anywhere else
      # produces commands that are visible and always refused.
      TIMOTHY_MANAGEMENT_GUILD_ID: ${TIMOTHY_MANAGEMENT_GUILD_ID:?set TIMOTHY_MANAGEMENT_GUILD_ID in .env}
      TIMOTHY_API_BASE_URL: http://backend:8000
      TIMOTHY_GATEWAY_ENABLED: ${TIMOTHY_GATEWAY_ENABLED:-true}
      TIMOTHY_SYNC_COMMANDS: ${TIMOTHY_SYNC_COMMANDS:-true}
      TIMOTHY_LOG_LEVEL: ${TIMOTHY_LOG_LEVEL:-INFO}
    networks: [timothy]

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks: [timothy]

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    depends_on: [web]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks: [timothy]

volumes:
  data:

networks:
  timothy:
    driver: bridge
