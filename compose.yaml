name: timothy

# One port is published, to 127.0.0.1 only: VictoriaLogs' UI on 9428, reached with
# `ssh -L 9428:localhost:9428 you@host`. Nothing else is. Cloudflare Tunnel is the only
# ingress from the internet and it fronts nginx, which serves the SPA and proxies /api to
# the backend. See PLAN.md, "Shape".
#
# The `127.0.0.1:` prefix on that binding is load-bearing and not decoration. A bare
# `9428:9428` would have Docker write its own iptables rules and publish the store to the
# network regardless of what UFW says — and VictoriaLogs has no authentication of its
# own. The loopback bind *is* the authentication: anyone with a shell here reads every
# log. See ADR 0015.
#
# Logs go two ways during this transition. Every service still mounts ./logs at /logs and
# writes a file there (ADR 0014), and every service's stdout is also read off the Docker
# socket by the collector and stored in VictoriaLogs (ADR 0015). The file layer goes away
# once the store has proven itself; until then the safety net stays up.

# The daemon's own buffer, bounded. It is no longer the durable record — that is
# VictoriaLogs — but `docker compose logs` is still the first thing anyone types, so it
# keeps a few hundred megabytes of recent history and no more. The `local` driver rather
# than `json-file` because it costs less to write and compresses what it rotates; the
# trade is that the files under /var/lib/docker are no longer tailable as JSON, which
# nothing here does.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  logs:
    # Makes ./logs writable by every service before any of them starts.
    #
    # These containers run as four different unprivileged users — timothy, nginx,
    # nonroot — and the bind mount arrives owned by whoever owns the directory on the
    # host. Without this, whichever service does not match that owner starts, fails to
    # open its log file, and carries on silently to stdout, which is the exact failure
    # the log directory exists to prevent. Running once as root and opening the
    # directory up is the least clever fix available; the alternative is pinning a uid
    # per service and asking whoever clones this to match it.
    image: busybox:1.37
    command: sh -c "mkdir -p /logs && chmod 0777 /logs"
    user: root
    volumes:
      - ./logs:/logs
    networks: [timothy]
    logging: *logging

  victorialogs:
    # Where the logs actually live now. One year, in a named volume.
    #
    # Pinned by tag and digest. VictoriaLogs holds no credential and listens only on
    # loopback, so the digest here is ordinary reproducibility rather than the
    # host-compromise argument that pins the collector below.
    image: victoriametrics/victoria-logs:v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e
    restart: unless-stopped
    command:
      - -storageDataPath=/victoria-logs-data
      - -httpListenAddr=:9428
      # A year, because the point of this is answering "when did this start?" about
      # something from eight months ago.
      - -retentionPeriod=${TIMOTHY_LOG_RETENTION:-1y}
      # The second bound, and it is load-bearing precisely because the first one is so
      # long: a runaway producer — a client-error flood, or TIMOTHY_LOG_LEVEL=debug left
      # on through a sweep — has a year to fill the disk. Note the semantics: at the cap
      # VictoriaLogs drops the OLDEST day partitions, so retention silently shortens
      # rather than ingestion failing. That is the right failure mode and it is a quiet
      # one, so it is worth looking at occasionally.
      - -retention.maxDiskSpaceUsageBytes=${TIMOTHY_LOG_MAX_DISK:-10GB}
    ports:
      # Loopback only — see the header. `ssh -L 9428:localhost:9428 you@host`, then
      # http://localhost:9428/select/vmui/.
      - "127.0.0.1:9428:9428"
    volumes:
      - victorialogs:/victoria-logs-data
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [timothy]
    logging: *logging

  collector:
    # Vector, reading every container's stdout off the Docker socket. Config in
    # vector/vector.yaml.
    #
    # MOUNTING THE DOCKER SOCKET IS A HOST-ROOT GRANT. `:ro` stops writes to the socket
    # *file* and constrains nothing about the API reachable through it — a process
    # holding this can start a privileged container, mount /, and read every secret on
    # the machine. Accepted deliberately: the trust boundary here is already "whoever can
    # run docker on this host", and a socket proxy is a third container to keep current.
    # If that ever stops feeling right, docker-socket-proxy drops in by pointing
    # `docker_host` at it and nothing else changes.
    #
    # What we do instead, none of which constrains the socket but all of which shrinks
    # everything around it: pin the DIGEST as well as the tag, because this is the one
    # container where a supply-chain substitution is host compromise; publish no port, so
    # the only inputs are the socket and log content itself; drop every capability and
    # take a read-only root filesystem.
    #
    # It runs as root. The pinned image sets no USER, ships no unprivileged account, and
    # owns /var/lib/vector as root — so `user:` plus `group_add` for the host's docker
    # gid would need an init container to chown the buffer volume, which is the exact
    # machinery ADR 0015 exists to delete. Checked rather than assumed, because a
    # silent, mode-shaped failure is what went wrong with logrotate.
    image: timberio/vector:0.57.0-alpine@sha256:19e3526faf4d4b1ed0c28a0d68d4cc3a1e13e437099986a5b7a768707907497c
    restart: unless-stopped
    depends_on:
      victorialogs:
        condition: service_started
    command: ["--config", "/etc/vector/vector.yaml"]
    environment:
      # Vector's own logs, which are not collected — it excludes itself, or every line
      # about posting a line would become a line to post. `warn` keeps its startup
      # chatter out of `docker compose logs` without hiding a broken sink.
      VECTOR_LOG: ${TIMOTHY_COLLECTOR_LOG_LEVEL:-warn}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      # Checkpoints and the disk buffer. The checkpoints are what bound how much is
      # re-read or skipped across a restart.
      - collector:/var/lib/vector
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [timothy]
    logging: *logging

  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      logs:
        condition: service_completed_successfully
    environment:
      TIMOTHY_LOG_LEVEL: ${TIMOTHY_LOG_LEVEL:-info}
      TIMOTHY_LOG_DIR: /logs
      # Spelled out rather than left to the default, like everything else here. The
      # collector needs fields, not sentences. Cost: `docker compose logs backend` is now
      # JSON — `| jq -r .message` undoes it, and vmui is the better place to read anyway.
      TIMOTHY_LOG_FORMAT: json
      TIMOTHY_DATABASE_URL: sqlite+aiosqlite:////data/timothy.db
      TIMOTHY_DISCORD_TOKEN: ${TIMOTHY_DISCORD_TOKEN:?set TIMOTHY_DISCORD_TOKEN in .env}
      TIMOTHY_INTERNAL_TOKEN: ${TIMOTHY_INTERNAL_TOKEN:?set TIMOTHY_INTERNAL_TOKEN in .env}
      TIMOTHY_MANAGEMENT_GUILD_ID: ${TIMOTHY_MANAGEMENT_GUILD_ID:?set TIMOTHY_MANAGEMENT_GUILD_ID in .env}
      # The role in the management guild that owns pools and listings (ADR 0012). Unset
      # closes pool management for everybody rather than falling back to that guild's
      # administrators — running a Discord server and curating the ban lists are
      # different jobs.
      TIMOTHY_POOL_MANAGER_ROLE_IDS: ${TIMOTHY_POOL_MANAGER_ROLE_IDS:-}
      # Whoever runs this deployment (ADR 0011). Unset closes the operations view for
      # everybody rather than falling back to the management guild's administrators.
      TIMOTHY_OWNER_IDS: ${TIMOTHY_OWNER_IDS:-}
      # The web UI's login. Unset closes it — `/auth/login` answers 503 and says what is
      # missing — rather than opening anything, so the stack still comes up without them.
      TIMOTHY_DISCORD_CLIENT_ID: ${TIMOTHY_DISCORD_CLIENT_ID:-}
      TIMOTHY_DISCORD_CLIENT_SECRET: ${TIMOTHY_DISCORD_CLIENT_SECRET:-}
      TIMOTHY_PUBLIC_BASE_URL: ${TIMOTHY_PUBLIC_BASE_URL:-}
      TIMOTHY_SESSION_LIFETIME: ${TIMOTHY_SESSION_LIFETIME:-604800}
      TIMOTHY_SESSION_COOKIE_SECURE: ${TIMOTHY_SESSION_COOKIE_SECURE:-true}
      TIMOTHY_DRY_RUN: ${TIMOTHY_DRY_RUN:-true}
      TIMOTHY_AUTO_SUBSCRIBE_POOL: ${TIMOTHY_AUTO_SUBSCRIBE_POOL:-global}
      TIMOTHY_PERMISSION_CACHE_TTL: ${TIMOTHY_PERMISSION_CACHE_TTL:-60}
      TIMOTHY_SWEEP_INTERVAL: ${TIMOTHY_SWEEP_INTERVAL:-604800}
      # How long a guild's diagnostics snapshot may go unrefreshed before the backend
      # calls it stale. The bot's own interval below is what sets the cadence; these two
      # read the same variable so they cannot drift apart.
      TIMOTHY_DIAGNOSTICS_INTERVAL: ${TIMOTHY_DIAGNOSTICS_INTERVAL:-900}
      TIMOTHY_ENFORCEMENT_BURST_LIMIT: ${TIMOTHY_ENFORCEMENT_BURST_LIMIT:-25}
      TIMOTHY_WORKERS_ENABLED: ${TIMOTHY_WORKERS_ENABLED:-true}
      TIMOTHY_JOB_POLL_INTERVAL: ${TIMOTHY_JOB_POLL_INTERVAL:-1}
      TIMOTHY_JOB_MAX_ATTEMPTS: ${TIMOTHY_JOB_MAX_ATTEMPTS:-5}
    volumes:
      - data:/data
      - ./logs:/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [timothy]
    logging: *logging

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      logs:
        condition: service_completed_successfully
    volumes:
      - ./logs:/logs
    environment:
      TIMOTHY_DISCORD_TOKEN: ${TIMOTHY_DISCORD_TOKEN:?set TIMOTHY_DISCORD_TOKEN in .env}
      TIMOTHY_INTERNAL_TOKEN: ${TIMOTHY_INTERNAL_TOKEN:?set TIMOTHY_INTERNAL_TOKEN in .env}
      # The same guild the backend reads. Registering the pool commands anywhere else
      # produces commands that are visible and always refused.
      TIMOTHY_MANAGEMENT_GUILD_ID: ${TIMOTHY_MANAGEMENT_GUILD_ID:?set TIMOTHY_MANAGEMENT_GUILD_ID in .env}
      TIMOTHY_API_BASE_URL: http://backend:8000
      TIMOTHY_GATEWAY_ENABLED: ${TIMOTHY_GATEWAY_ENABLED:-true}
      TIMOTHY_SYNC_COMMANDS: ${TIMOTHY_SYNC_COMMANDS:-true}
      # How often to report what the gateway sees of every guild (ADR 0016), spread
      # evenly across the interval rather than sent in one burst. The backend's
      # TIMOTHY_DIAGNOSTICS_INTERVAL above is the same value.
      TIMOTHY_DIAGNOSTICS_INTERVAL_SECONDS: ${TIMOTHY_DIAGNOSTICS_INTERVAL:-900}
      TIMOTHY_LOG_LEVEL: ${TIMOTHY_LOG_LEVEL:-INFO}
      TIMOTHY_LOG_DIR: /logs
      TIMOTHY_LOG_FORMAT: json
    networks: [timothy]
    logging: *logging

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      logs:
        condition: service_completed_successfully
    environment:
      # How often the container asks whether nginx's two log files need rotating.
      # `size` is the only condition in web/logrotate.conf, so this is the resolution of
      # the check and not a schedule — lowering it does not rotate more often, it just
      # notices sooner. Exposed mainly so the behaviour can be exercised without waiting
      # ten minutes.
      TIMOTHY_LOG_ROTATE_INTERVAL: ${TIMOTHY_LOG_ROTATE_INTERVAL:-600}
    volumes:
      - ./logs:/logs
      # Berkeley Mono is licensed and is in neither the repository nor the image. Point
      # TIMOTHY_BERKELEY_MONO_DIR at an unpacked copy on this host to serve it. Left
      # unset, this mounts the empty tracked directory and the industrial theme renders
      # in IBM Plex Mono instead, which is committed and ships in the image. Read-only:
      # nginx has no business writing to somebody's font licence.
      - ${TIMOTHY_BERKELEY_MONO_DIR:-./web/public/fonts/berkeley}:/usr/share/nginx/html/fonts/berkeley:ro
    networks: [timothy]
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    depends_on:
      web:
        condition: service_started
      logs:
        condition: service_completed_successfully
    volumes:
      - ./logs:/logs
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
      # `LOGDIRECTORY` rather than `LOGFILE`: cloudflared rotates the former and lets
      # the latter grow without bound. It writes `cloudflared.log` into this directory,
      # beside the rest. The one service here whose logs are about reachability rather
      # than about Timothy — "the tunnel was down" is the answer to a surprising number
      # of "the UI was broken" reports, and only answerable if the record outlasts the
      # container.
      TUNNEL_LOGDIRECTORY: /logs
      TUNNEL_LOGLEVEL: ${CLOUDFLARE_TUNNEL_LOGLEVEL:-info}
    networks: [timothy]
    logging: *logging

volumes:
  data:
  victorialogs:
  collector:

networks:
  timothy:
    driver: bridge
