name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, type check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --locked

      - name: Format
        run: uv run ruff format --check --diff .

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  stack:
    name: images build and the stack comes up
    runs-on: ubuntu-latest
    env:
      # compose interpolation requires these on every compose invocation, including
      # `logs` and `exec`. cloudflared is never started, so the value is irrelevant, and
      # the Discord token is never used: the backend logs in lazily, on the first call
      # that needs Discord, and nothing here makes one.
      TIMOTHY_DISCORD_TOKEN: ci-placeholder
      CLOUDFLARE_TUNNEL_TOKEN: ci-placeholder
      TIMOTHY_INTERNAL_TOKEN: ci-placeholder
      TIMOTHY_MANAGEMENT_GUILD_ID: "1"
      # The bot would otherwise try to log in to Discord with the placeholder above and
      # crash-loop. Everything up to that point — the image, the process, the backend
      # connection — is still exercised; the gateway itself has no stand-in in CI.
      TIMOTHY_GATEWAY_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # This rebuilds all three images from scratch every run — no layer cache is
      # wired up yet. Deferred deliberately; revisit when the builds get slow.
      #
      # cloudflared is left out: it needs a real tunnel token and has nothing to
      # front in CI. Everything behind it is exercised below.
      - name: Start backend, bot and web
        run: docker compose up --build --wait --wait-timeout 180 backend bot web

      - name: The SPA origin proxies /api to the backend
        run: |
          docker compose exec -T web wget -qO- http://127.0.0.1/api/health | grep -q '"status":"ok"'
          docker compose exec -T web wget -qO- http://127.0.0.1/api/openapi.json | grep -q '"title":"Timothy"'
          docker compose exec -T web wget -qO- http://127.0.0.1/ | grep -q '<title>Timothy</title>'

      - name: The SPA history fallback serves index.html
        run: |
          docker compose exec -T web wget -qO- http://127.0.0.1/pools/anything | grep -q '<title>Timothy</title>'

      # nginx proxies /api from what will be a public tunnel, so this is the check that
      # the internal token is really in front of the API and not merely configured.
      - name: The API is closed to callers without the internal token
        run: |
          docker compose exec -T web sh -c '
            wget -qS -O /dev/null http://127.0.0.1/api/pools 2>&1 | grep -q "401 Unauthorized"
          '

      - name: The backend migrated its own database to head on startup
        run: |
          docker compose exec -T backend python -c "
          import sqlite3, sys
          db = sqlite3.connect('/data/timothy.db')
          tables = {r[0] for r in db.execute(
              \"SELECT name FROM sqlite_master WHERE type='table'\")}
          columns = {r[1] for r in db.execute('PRAGMA table_info(jobs)')}
          sys.exit(0 if {'pools', 'listings', 'alembic_version'} <= tables
                   and 'last_error' in columns else 1)
          "

      # The settings are parsed from compose's own values here, which is what the unit
      # tests cannot do: a duration written as plain seconds once passed every test and
      # still stopped the container from starting.
      - name: The enforcement worker and sweep scheduler are running
        run: |
          docker compose logs backend | grep -q 'starting enforcement worker and sweep scheduler'

      - name: A relayed gateway event is closed to callers without the internal token
        run: |
          docker compose exec -T web sh -c '
            wget -qS -O /dev/null --post-data="{}" \
              --header="Content-Type: application/json" \
              http://127.0.0.1/api/events/member-join 2>&1 | grep -q "401 Unauthorized"
          '

      # Registering a guild is the one mutation that needs no Discord call, so it is the
      # only end-to-end exercise of the queue available without a real bot token.
      - name: A restart sweeps the guilds it knows about, and the worker drains it
        run: |
          docker compose exec -T backend python -c "
          import urllib.request
          urllib.request.urlopen(urllib.request.Request(
              'http://localhost:8000/guilds/123456789012345678', method='PUT',
              headers={'Authorization': 'Bearer ci-placeholder',
                       'X-Timothy-Actor': 'system'}))
          "
          docker compose restart backend
          docker compose up --wait --wait-timeout 60 backend
          sleep 5
          docker compose exec -T backend python -c "
          import sqlite3, sys
          rows = list(sqlite3.connect('/data/timothy.db').execute(
              'SELECT kind, status FROM jobs'))
          print(rows)
          sys.exit(0 if ('enforce_guild', 'done') in rows else 1)
          "

      # The loops are asked to stop rather than cancelled, because a task cancelled
      # part-way through a transaction cannot finish closing its session and the
      # connection then outlives the engine. A dirty exit code is how that shows up.
      - name: The backend shuts its workers down cleanly
        run: |
          docker compose stop backend
          test "$(docker inspect -f '{{.State.ExitCode}}' "$(docker compose ps -aq backend)")" = "0"
          docker compose logs backend | grep -q 'Application shutdown complete'
          ! docker compose logs backend | grep -qE 'Task exception was never retrieved|ResourceWarning'
          docker compose start backend
          docker compose up --wait --wait-timeout 60 backend

      - name: The bot reached the backend before trying to reach Discord
        run: |
          docker compose logs bot | grep -q 'backend reachable'
          docker compose logs bot | grep -q 'gateway disabled'

      # The bot's own HTTP client against the real API: the internal token, the actor
      # header and the routes, none of which the unit tests can prove together because
      # the bot cannot import the backend. Registering a guild is the only call that
      # needs no Discord, and with no `global` pool it enqueues nothing.
      - name: The bot's API client is accepted by the backend
        run: |
          docker compose exec -T bot python -c "
          import asyncio, sys
          from timothy_bot import api

          async def main():
              async with api.create_client(
                  base_url='http://backend:8000', token='ci-placeholder', timeout=5
              ) as http:
                  guild = await api.Api(http, actor=api.SYSTEM).register_guild(222222222222222222)
                  assert guild['guild_id'] == '222222222222222222', guild
                  try:
                      await api.Api(http, actor='user:1').register_guild(1)
                  except api.ApiError as refused:
                      assert refused.status_code == 403, refused.detail
                  else:
                      sys.exit('a human was allowed to register a guild')

          asyncio.run(main())
          "

      # The command tree is built from the same code that would upload it, so a command
      # that cannot even be constructed fails here rather than at the first sync.
      - name: The bot can build its command tree
        run: |
          docker compose exec -T bot python -c "
          import discord, sys
          from discord import app_commands
          from timothy_bot import commands
          tree = app_commands.CommandTree(discord.Client(intents=discord.Intents.none()))
          commands.install(tree, management_guild_id=1)
          names = {c.name for c in tree.get_commands()}
          managed = {c.name for c in tree.get_commands(guild=discord.Object(id=1))}
          sys.exit(0 if len(names) == 10 and len(managed) == 6 else 1)
          "

      - name: The backend runs unprivileged
        run: test "$(docker compose exec -T backend id -u | tr -d '\r')" != "0"

      # The seam the migration's own tests cannot reach: a database written by
      # `timothy-migrate` outside any container, served by the real backend image. If the
      # importer ever writes a schema the backend would migrate again — or one it refuses
      # — this is where that shows up, rather than on cutover morning.
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build a dump and import it outside the containers
        run: |
          uv sync --locked
          uv run python -c "
          import sys; sys.path.insert(0, 'migration/tests')
          import dumps
          from pathlib import Path
          dumps.build(
              Path('cutover/dump'),
              banpools=[dumps.pool('global', 'the shared banlist')],
              bans=[dumps.ban(1001, 'global', reason='ban evasion')],
          )
          dumps.snapshot(Path('cutover/guilds.json'), [222222222222222222])
          "
          uv run timothy-migrate import \
            --dump cutover/dump \
            --guilds cutover/guilds.json \
            --database cutover/timothy.db
          uv run timothy-migrate verify --dump cutover/dump --database cutover/timothy.db
          python -c "
          import sqlite3
          revision, = sqlite3.connect('cutover/timothy.db').execute(
              'SELECT version_num FROM alembic_version').fetchone()
          print(revision)
          " > cutover/revision.txt

      - name: The backend serves a database the migration wrote
        run: |
          docker compose cp cutover/timothy.db backend:/data/imported.db
          docker compose exec -T -u root backend sh -c '
            rm -f /data/timothy.db /data/timothy.db-wal /data/timothy.db-shm
            mv /data/imported.db /data/timothy.db
            chown timothy:timothy /data/timothy.db
          '
          docker compose restart backend
          docker compose up --wait --wait-timeout 60 backend
          docker compose exec -T backend python -c "
          import sqlite3, sys
          db = sqlite3.connect('/data/timothy.db')
          pools = list(db.execute('SELECT id, name FROM pools'))
          listings = list(db.execute('SELECT COUNT(*) FROM listings'))
          # Empty on purpose: an outcome is Timothy's claim to have issued a ban itself
          # (ADR 0005), and every ban the old bot placed is not Timothy's.
          outcomes = list(db.execute('SELECT COUNT(*) FROM enforcement_outcomes'))
          print(pools, listings, outcomes)
          sys.exit(0 if pools == [(1, 'global')]
                   and listings == [(1,)] and outcomes == [(0,)] else 1)
          "

      # The import brings the schema to head itself, so starting the backend on it must be
      # a no-op. A revision that moved here means the two are building different schemas.
      - name: The backend had no migrations left to run on it
        run: |
          after="$(docker compose exec -T backend python -c "
          import sqlite3
          print(sqlite3.connect('/data/timothy.db').execute(
              'SELECT version_num FROM alembic_version').fetchone()[0])
          " | tr -d '\r')"
          test "$after" = "$(cat cutover/revision.txt)"

      - name: Dump logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
